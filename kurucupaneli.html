<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Network - Kurucu Paneli</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: 40px auto;
    background: #161b22;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 30px;
}
h1 {
    color: #fbbf24;
    text-align: center;
    margin-bottom: 25px;
    font-size: 26px;
}
.admin-item {
    background: #0d1117;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}
.action-btn {
    padding: 8px 16px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}
.action-btn:hover { background: #059669; }
.back-btn {
    display: inline-block;
    margin-bottom: 20px;
    color: #8b5cf6;
    text-decoration: none;
    font-weight: bold;
}
.back-btn:hover { text-decoration: underline; }

/* Şifre Ekranı Modal */
#passwordScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #0d1117;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}
.pass-box {
    background: #161b22;
    padding: 40px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center;
    width: 350px;
}
.pass-box input {
    width: 100%; padding: 12px; margin: 15px 0;
    background: #0d1117; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: white; text-align: center; font-size: 16px;
    outline: none;
}

/* Özel Site İçi Uyarı Kutusu (Alert Yerine) */
#customAlert {
    position: fixed;
    top: 30px; right: 30px;
    background: #1f2937;
    border-left: 4px solid #ef4444;
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    z-index: 9999;
    display: none;
    font-weight: 600;
    font-size: 14px;
}
#customAlert.success {
    border-left-color: #10b981;
}
</style>
</head>
<body>

<!-- Özel Site İçi Uyarı Kutusu -->
<div id="customAlert"></div>

<!-- Şifre İsteme Ekranı -->
<div id="passwordScreen">
    <div class="pass-box">
        <h2 style="color: #fbbf24; margin-bottom: 10px;"><i class="fa-solid fa-lock"></i> Kurucu Şifresi</h2>
        <p style="font-size: 13px; color: #9ca3af;">Devam etmek için şifreyi gir:</p>
        <input type="password" id="passInput" placeholder="Şifre">
        <button class="action-btn" style="width: 100%; padding: 12px;" onclick="checkPassword()">Giriş Yap</button>
    </div>
</div>

<!-- Asıl Kurucu Paneli İçeriği -->
<div class="container" id="panelContent" style="display: none;">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a>
    <h1>🛡️ Monarch Network - Yönetici Paneli</h1>
    <p style="text-align: center; color: #9ca3af; margin-bottom: 25px;">Oyuncuların gönderdiği tüm destek talepleri ve yetkili başvuruları:</p>
    
    <div id="submissionsList">
        <!-- JavaScript ile doldurulacak -->
    </div>
</div>

<script>
// Tarayıcı alerti yerine şık site içi uyarı fonksiyonu
function showNotification(message, isSuccess = false) {
    const alertBox = document.getElementById("customAlert");
    alertBox.textContent = message;
    alertBox.style.borderLeftColor = isSuccess ? "#10b981" : "#ef4444";
    alertBox.className = isSuccess ? "success" : "";
    alertBox.style.display = "block";
    
    setTimeout(() => {
        alertBox.style.display = "none";
    }, 3000);
}

function checkPassword() {
    const val = document.getElementById("passInput").value;
    if (val === "PARSA.112") {
        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("panelContent").style.display = "block";
        loadSubmissions();
    } else {
        showNotification("Yanlış şifre! Erişim reddedildi.");
    }
}

function loadSubmissions() {
    const list = document.getElementById("submissionsList");
    const submissions = JSON.parse(localStorage.getItem("monarch_submissions") || "[]");

    if (submissions.length === 0) {
        list.innerHTML = `<p style="text-align: center; color: #6b7280; padding: 30px;">Henüz gelen bir talep veya başvuru bulunmuyor.</p>`;
        return;
    }

    list.innerHTML = submissions.map((item, index) => `
        <div class="admin-item">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <strong style="color:#fbbf24;">[${item.type}] ${item.title || 'Talep'}</strong>
                <span style="color:#10b981; font-weight:bold;">${item.status || 'BEKLEMEDE'}</span>
            </div>
            <p style="color:#e6edf3; margin-bottom:5px;"><strong>Gönderen:</strong> ${item.user || 'Bilinmiyor'}</p>
            <p style="color:#9ca3af; margin-bottom:12px;"><strong>İçerik:</strong> ${item.content || item.message}</p>
            
            <div style="background:#161b22; padding:10px; border-radius:6px;">
                <input type="text" id="reply_${index}" placeholder="Oyuncuya yanıt yaz..." value="${item.reply || ''}" style="width:100%; padding:8px; margin-bottom:8px; background:#0d1117; border:1px solid rgba(255,255,255,0.1); border-radius:4px; color:white; font-size:13px; outline:none;">
                <button class="action-btn" onclick="saveReply(${index}, '${item.type}')">Yanıtı Gönder & Güncelle</button>
            </div>
        </div>
    `).join('');
}

function saveReply(index, type) {
    let submissions = JSON.parse(localStorage.getItem("monarch_submissions") || "[]");
    const replyText = document.getElementById(`reply_${index}`).value.trim();

    if (!replyText) {
        showNotification("Lütfen bir yanıt yaz!");
        return;
    }

    submissions[index].reply = replyText;
    submissions[index].status = type === "Başvuru" ? "KABUL EDİLDİ" : "CEVAPLANDI";

    localStorage.setItem("monarch_submissions", JSON.stringify(submissions));
    showNotification("Yanıt başarıyla oyuncuya iletildi!", true);
    loadSubmissions();
}
</script>

</body>
</html>
