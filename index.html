<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Network</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

header{
    padding:100px 20px;
}

h1{
    font-size:60px;
    color:#8b5cf6;
}

p{
    font-size:20px;
}

button{
    background:#8b5cf6;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
    font-size:16px;
}

button:hover{
    background:#7c3aed;
}

.card{
    background:#1e293b;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    max-width:600px;
}
</style>
</head>

<body>

<header>
    <h1>MONARCH NETWORK</h1>

    <p>Yakında Açılıyor!</p>

    <button onclick="copyIP()">
        IP'yi Kopyala
    </button>

    <button>
        Kayıt Ol
    </button>
</header>

<div class="card">
    <h2>Sunucu IP</h2>
    <p>monarch.aternos.me</p>
</div>

<div class="card">
    <h2>Durum</h2>
    <p>Geliştirme Aşamasında 🚀</p>
</div>

<script>
function copyIP(){
    navigator.clipboard.writeText("monarch.aternos.me");
    alert("IP Kopyalandı!");
}
</script>

</body>
</html>
