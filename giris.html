<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Network - Giriş Yap</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: #0d1117; color: #e6edf3; display: flex; justify-content: center; align-items: center; height: 100vh; }
.box { background: #161b22; border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 16px; width: 380px; text-align: center; }
h2 { color: #fbbf24; margin-bottom: 20px; }
input { width: 100%; padding: 12px; margin: 10px 0; background: #0d1117; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; outline: none; }
button { width: 100%; padding: 12px; background: #8b5cf6; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
button:hover { background: #7c3aed; }
a { color: #fbbf24; text-decoration: none; font-weight: bold; }
p { margin-top: 15px; font-size: 13px; color: #9ca3af; }

/* Şık Bildirim Kutusu */
#customAlert { position: fixed; top: 30px; right: 30px; background: #1f2937; border-left: 4px solid #ef4444; color: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 9999; display: none; font-weight: 600; font-size: 14px; }
#customAlert.success { border-left-color: #10b981; }
</style>
</head>
<body>

<div id="customAlert"></div>

<div class="box">
    <h2>🔑 Giriş Yap</h2>
    <input type="text" id="loginUser" placeholder="Kullanıcı Adı">
    <input type="password" id="loginPass" placeholder="Şifre">
    <button onclick="loginProcess()">Giriş Yap</button>
    <p>Hesabın yok mu? <a href="kayit.html">Kayıt Ol</a></p>
    <p style="margin-top: 10px;"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a></p>
</div>

<script>
function showNotification(message, isSuccess = false) {
    const alertBox = document.getElementById("customAlert");
    alertBox.textContent = message;
    alertBox.style.borderLeftColor = isSuccess ? "#10b981" : "#ef4444";
    alertBox.className = isSuccess ? "success" : "";
    alertBox.style.display = "block";
    setTimeout(() => { alertBox.style.display = "none"; }, 3000);
}

function loginProcess() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!user || !pass) {
        showNotification("Lütfen tüm alanları doldurun!");
        return;
    }

    const savedPass = localStorage.getItem("user_" + user);

    if (savedPass && savedPass === pass) {
        localStorage.setItem("loggedInUser", user);
        showNotification("Giriş başarılı! Ana sayfaya yönlendiriliyorsunuz.", true);
        setTimeout(() => { window.location.href = "index.html"; }, 1500);
    } else {
        showNotification("Kullanıcı adı veya şifre hatalı!");
    }
}
</script>

</body>
</html>
