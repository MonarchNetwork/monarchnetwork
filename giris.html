<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Network - Giriş Yap</title>
<style>
body{background:#0b1020; font-family:Arial,sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; color:white;}
.box{background:#1e293b; padding:40px; border-radius:15px; width:350px; text-align:center;}
h1{color:gold; margin-bottom: 20px;}
input{width:100%; padding:12px; margin:10px 0; border:none; border-radius:8px; background: #334155; color: white; outline: none;}
input::placeholder {color: #cbd5e1;}
button{width:100%; padding:12px; background:#7c3aed; border:none; border-radius:8px; color:white; cursor:pointer; font-weight: bold; margin-top: 10px;}
button:hover{background:#6d28d9;}
a{color:gold; text-decoration:none; font-weight: bold;}
a:hover{text-decoration: underline;}
p{margin: 15px 0;}
</style>
</head>
<body>

<div class="box">
    <h1>🔑 Giriş Yap</h1>
    <input type="text" id="loginUser" placeholder="Kullanıcı Adı" required>
    <input type="password" id="loginPass" placeholder="Şifre" required>
    <button onclick="loginProcess()">Giriş Yap</button>
    <br><br>
    <p>Hesabın yok mu? <a href="kayit.html">Kayıt Ol</a></p>
    <p><a href="index.html">🏠 Ana Sayfaya Dön</a></p>
</div>

<script>
function loginProcess() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if(!user || !pass) {
        alert("Lütfen tüm alanları doldurun!");
        return;
    }

    // Tarayıcı hafızasından kullanıcıyı ara
    const savedPass = localStorage.getItem("user_" + user);

    if(savedPass && savedPass === pass) {
        localStorage.setItem("loggedInUser", user); // Giriş durumunu kaydet
        alert("Giriş başarılı! Ana sayfaya yönlendiriliyorsunuz.");
        window.location.href = "index.html";
    } else {
        alert("Kullanıcı adı veya şifre hatalı!");
    }
}
</script>
</body>
</html>
