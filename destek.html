<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Network - Destek Sistemi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0f172a;color:white;}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 10%;background:#111827;}
.logo {color:gold;font-size:28px;font-weight:bold;text-decoration: none;}
.nav-user {display: flex;align-items: center;gap: 15px;}
.welcome-txt {color: gold;font-weight: bold;}
.support-container {max-width: 600px;margin: 50px auto;background: #1e293b;padding: 40px;border-radius: 20px;border: 2px solid #334155;}
.support-container h1 {color: gold;font-size: 32px;margin-bottom: 10px;text-align: center;}
.support-container p {color: #cbd5e1;font-size: 15px;margin-bottom: 30px;text-align: center;}
.form-group {margin-bottom: 20px;}
.form-group label {display: block;color: gold;font-weight: bold;margin-bottom: 8px;font-size: 14px;}
.form-group input, .form-group select, .form-group textarea {width: 100%;padding: 12px;border: none;border-radius: 8px;background: #334155;color: white;outline: none;font-size: 15px;}
.submit-btn {width: 100%;padding: 14px;background: #7c3aed;border: none;border-radius: 8px;color: white;font-size: 16px;font-weight: bold;cursor: pointer;margin-top: 10px;}
.box {border: 1px solid gold;padding: 20px;margin-top: 20px;border-radius: 12px;background: #111827;}
footer{text-align:center;padding:20px;background:#111827;margin-top:60px;}
</style>
</head>
<body>

<nav>
<a href="index.html" class="logo">👑 MONARCH NETWORK</a>
<div id="navAuth" class="nav-user"></div>
</nav>

<div class="support-container">
    <h1>🛠️ Destek Talebi Oluştur</h1>
    <p>Yaşadığın sorunu anlat, yetkililerimiz incelesin!</p>
    
    <div id="noAuthAlert" style="display:none; text-align:center; padding:20px; background:#ef444433; border-radius:10px; margin-bottom:20px; color:#ef4444; font-weight:bold;">
        ⚠️ Destek talebi açmak için önce ana sayfadan giriş yapmalısınız!
    </div>

    <form id="supportForm" onsubmit="sendTicket(event)">
        <div class="form-group">
            <label>📌 Talep Kategorisi</label>
            <select id="ticketCategory" required>
                <option value="" disabled selected>Bir kategori seçin...</option>
                <option value="Ceza İtirazı">⚖️ Ceza İtirazı</option>
                <option value="Oyuncu Şikayeti">⚔️ Oyuncu Şikayeti</option>
                <option value="Hata Bildirimi (Bug)">🐛 Hata Bildirimi</option>
                <option value="Ödeme Sorunu">💎 Ödeme Sorunu</option>
            </select>
        </div>
        <div class="form-group">
            <label>📝 Konu Başlığı</label>
            <input type="text" id="ticketSubject" required>
        </div>
        <div class="form-group">
            <label>💬 Mesajınız</label>
            <textarea id="ticketMessage" required></textarea>
        </div>
        <button type="submit" id="submitBtn" class="submit-btn">Talebi Gönder</button>
    </form>

    <div id="ticketTracking" style="display:none; margin-top: 40px; border-top: 2px dashed #334155; padding-top: 25px;">
        <h2 style="color: gold; font-size: 22px; text-align: center; margin-bottom: 15px;">📜 Aktif Destek Talebiniz</h2>
        <div id="ticketContent"></div>
    </div>
</div>

<footer>© Monarch Network</footer>

<script>
const GITHUB_USER = "monarchnetwork";
const GITHUB_REPO = "monarchnetwork";

// ⚠️ BURAYA DİKKAT: Token kodunu aşağıya yapıştıracaksın kanka!
const GITHUB_TOKEN = "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"; 

let loggedInUser = localStorage.getItem("loggedInUser");

function checkLoginStatus() {
    if (loggedInUser) {
        document.getElementById("navAuth").innerHTML = `<span class="welcome-txt">👋 ${loggedInUser}</span>`;
        loadActiveTicket(); 
    } else {
        document.getElementById("navAuth").innerHTML = `<span style="color:#ef4444;">⚠️ Giriş Yapılmadı</span>`;
        document.getElementById("noAuthAlert").style.display = "block";
        document.getElementById("supportForm").style.display = "none";
    }
}

async function sendTicket(event) {
    event.preventDefault();
    if (!loggedInUser) return;

    const category = document.getElementById("ticketCategory").value;
    const subject = document.getElementById("ticketSubject").value.trim();
    const message = document.getElementById("ticketMessage").value.trim();
    
    const veri = {
        oyuncu: loggedInUser,
        kategori: category,
        konu: subject,
        mesaj: message,
        yoneticiYaniti: "Talebiniz alındı. Yetkililerimiz yanıtladığında burada gözükecektir.",
        tarih: new Date().toLocaleString("tr-TR")
    };
    
    document.getElementById("submitBtn").disabled = true;
    
    const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/database/destek_${loggedInUser}.json`;
    let sha = "";
    try { const check = await fetch(url); if(check.ok) { const d = await check.json(); sha = d.sha; } } catch(e){}

    const res = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            message: `Destek: ${loggedInUser}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(veri, null, 2)))),
            sha: sha ? sha : undefined
        })
    });
    
    if (res.ok) {
        alert("Destek talebiniz oluşturuldu!");
        loadActiveTicket();
    } else {
        alert("Hata oluştu! Token kodunuzu doğru girdiğinizden emin olun.");
    }
    document.getElementById("submitBtn").disabled = false;
}

async function loadActiveTicket() {
    const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/database/destek_${loggedInUser}.json?nocache=${new Date().getTime()}`;
    try {
        const res = await fetch(url);
        if(!res.ok) return;
        const data = await res.json();
        const icerik = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        document.getElementById("ticketTracking").style.display = "block";
        document.getElementById("ticketContent").innerHTML = `
            <div class="box">
                <p><strong>📌 Kategori:</strong> ${icerik.kategori}</p>
                <p><strong>📝 Konu:</strong> ${icerik.konu}</p>
                <p><strong>💬 Mesajınız:</strong> ${icerik.mesaj}</p>
                <hr style="margin:15px 0; border:0; border-top:1px dashed #334155;">
                <p style="color:#ffcc00;"><strong>👑 Yönetici Yanıtı:</strong></p>
                <p style="color:#10b981; font-weight:bold; background:#0f172a; padding:10px; border-radius:5px;">${icerik.yoneticiYaniti}</p>
            </div>`;
    } catch(e){}
}
window.onload = checkLoginStatus;
</script>
</body>
</html>
