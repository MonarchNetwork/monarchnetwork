<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Network - Destek Sistemi</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 10%;
background:#111827;
}

.logo {
color:gold;
font-size:28px;
font-weight:bold;
text-decoration: none;
}

.nav-user {
display: flex;
align-items: center;
gap: 15px;
}

.welcome-txt {
color: gold;
font-weight: bold;
}

.btn{
padding:12px 25px;
background:#3b82f6;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
font-size:16px;
text-decoration: none;
display: inline-block;
font-weight: bold;
}

.btn:hover{
background:#2563eb;
}

.support-container {
max-width: 600px;
margin: 50px auto;
background: #1e293b;
padding: 40px;
border-radius: 20px;
border: 2px solid #334155;
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.support-container h1 {
color: gold;
font-size: 32px;
margin-bottom: 10px;
text-align: center;
}

.support-container p {
color: #cbd5e1;
font-size: 15px;
margin-bottom: 30px;
text-align: center;
}

.form-group {
margin-bottom: 20px;
}

.form-group label {
display: block;
color: gold;
font-weight: bold;
margin-bottom: 8px;
font-size: 14px;
}

.form-group input, .form-group select, .form-group textarea {
width: 100%;
padding: 12px;
border: none;
border-radius: 8px;
background: #334155;
color: white;
outline: none;
font-size: 15px;
}

.form-group input::placeholder, .form-group textarea::placeholder {
color: #94a3b8;
}

.form-group textarea {
resize: vertical;
min-height: 120px;
}

.submit-btn {
width: 100%;
padding: 14px;
background: #7c3aed;
border: none;
border-radius: 8px;
color: white;
font-size: 16px;
font-weight: bold;
cursor: pointer;
transition: background 0.2s;
margin-top: 10px;
}

.submit-btn:hover {
background: #6d28d9;
}

footer{
text-align:center;
padding:20px;
background:#111827;
margin-top:60px;
}
</style>
</head>

<body>

<nav>
<a href="index.html" class="logo">👑 MONARCH NETWORK</a>
<div id="navAuth" class="nav-user"></div>
</nav>

<div class="support-container">
    <h1>🛠️ Destek Talebi Oluştur</h1>
    <p>Yaşadığın sorunu detaylıca anlat, yetkililerimiz en kısa sürede incelesin!</p>
    
    <form id="supportForm" onsubmit="sendTicket(event)">
        <div class="form-group">
            <label for="ticketCategory">📌 Talep Kategorisi</label>
            <select id="ticketCategory" required>
                <option value="" disabled selected>Bir kategori seçin...</option>
                <option value="Ceza İtirazı">⚖️ Ceza İtirazı </option>
                <option value="Oyuncu Şikayeti">⚔️ Oyuncu Şikayeti / Rapor</option>
                <option value="Hata Bildirimi (Bug)">🐛 Hata Bildirimi (Bug)</option>
                <option value="Ödeme / Mağaza Sorunu">💎 Ödeme / Mağaza Sorunu</option>
                <option value="Hesap / Şifre Sorunları">🔑 Hesap / Şifre Sorunları</option>
                <option value="Öneri / İstek">💡 Öneri / İstek</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ticketSubject">📝 Konu Başlığı</label>
            <input type="text" id="ticketSubject" placeholder="Örn: Hile bildirimi, VIP yetkim gelmedi, Haksızlığa uğradım vb.." required>
        </div>

        <div class="form-group">
            <label for="ticketMessage">💬 Mesajınız</label>
            <textarea id="ticketMessage" placeholder="Sorununuzu, tarihlerini veya şikayetçi olduğunuz oyuncu adını buraya detaylıca yazın..." required></textarea>
        </div>
<!-- FOTOĞRAF YÜKLEME ALANI -->
<div class="form-group" style="margin-top: 20px;">
    <label>📸 Ekran Görüntüsü / Kanıt (Opsiyonel)</label>
    <input type="file" id="ticketFile" accept="image/*" style="background: #334155; padding: 10px; width: 100%; border-radius: 8px; color: white;">
</div>
        <button type="submit" class="submit-btn">Talebi Gönder</button>
    </form>
    
    <div style="text-align: center; margin-top: 25px;">
        <a href="index.html" style="color: gold; text-decoration: none; font-weight: bold; font-size: 14px;">← Ana Sayfaya Dön</a>
    </div>
</div>

<footer>
© Monarch Network
</footer>

<script>
// Giriş kontrolü (Kullanıcı adını nav kısmına yazar)
function checkLoginStatus() {
    const loggedInUser = localStorage.getItem("loggedInUser");
    const navAuth = document.getElementById("navAuth");

    if (loggedInUser) {
        navAuth.innerHTML = `<span class="welcome-txt">👋 ${loggedInUser}</span>`;
    } else {
        navAuth.innerHTML = `<span style="color:#ef4444; font-size:14px; font-weight:bold;">⚠️ Giriş Yapılmadı</span>`;
    }
}

// Bilet gönderme fonksiyonu
function sendTicket(event) {
    event.preventDefault(); // Sayfanın yenilenmesini engeller
    
    const loggedInUser = localStorage.getItem("loggedInUser");
    
    // Eğer siteye giriş yapmadıysa bilet gönderemez!
    if (!loggedInUser) {
        alert("Destek talebi oluşturabilmek için önce ana sayfadan giriş yapmalı veya kayıt olmalısınız!");
        return;
    }

    const category = document.getElementById("ticketCategory").value;
// GitHub Bilgilerin
const GITHUB_USER = "monarchnetwork";
const GITHUB_REPO = "monarchnetwork";
const GITHUB_TOKEN = "PARSA.112"; // Kendi Token kodunu buraya yapıştır kanka

let loggedInUser = localStorage.getItem("loggedInUser");

// Giriş kontrolü ve eski talepleri yükleme
function checkLoginStatus() {
    const navAuth = document.getElementById("navAuth");
    if (loggedInUser) {
        navAuth.innerHTML = `<span class="welcome-txt">👋 ${loggedInUser}</span>`;
        loadActiveTicket(); 
    } else {
        navAuth.innerHTML = `<span style="color:#ef4444; font-size:14px; font-weight:bold;">⚠️ Giriş Yapılmadı</span>`;
    }
}

// GitHub'a Talebi Kaydetme ve Gönderme Fonksiyonu
async function sendTicket(event) {
    event.preventDefault();
    if (!loggedInUser) {
        alert("Destek talebi oluşturabilmek için önce ana sayfadan giriş yapmalı veya kayıt olmalısınız!");
        return;
    }

    const category = document.getElementById("ticketCategory").value;
    const subject = document.getElementById("ticketSubject").value.trim();
    const message = document.getElementById("ticketMessage").value.trim();
    const fileInput = document.getElementById("ticketFile");
    
    let base64Image = "Kanıt yüklenmedi";
    if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        base64Image = await convertFileToBase64(file);
    }

    const dosyaYolu = `database/destek_${loggedInUser}.json`;
    const veri = {
        oyuncu: loggedInUser,
        kategori: category,
        konu: subject,
        mesaj: message,
        kanit: base64Image,
        yoneticiYaniti: "Talebiniz başarıyla alındı. Yetkililerimiz inceliyor, yanıtlandığında burada gözükecektir.",
        tarih: new Date().toLocaleString("tr-TR")
    };

    alert("Talebiniz gönderiliyor, lütfen bekleyin...");
    await saveToGitHub(dosyaYolu, veri);
    alert(`Teşekkürler ${loggedInUser}! Talebiniz alındı. Sayfayı yenileyerek takip edebilirsiniz.`);
    document.getElementById("supportForm").reset();
    loadActiveTicket();
}

// Oyuncunun Kendi Ekranında Yanıtı Görme Fonksiyonu
async function loadActiveTicket() {
    const dosyaYolu = `database/destek_${loggedInUser}.json`;
    const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${dosyaYolu}`;

    try {
        const res = await fetch(url);
        if(!res.ok) return; 
        
        const data = await res.json();
        const icerik = JSON.parse(atob(data.content));

        // Formun altına izleme alanını ekliyoruz
        let trackDiv = document.getElementById("ticketTracking");
        if(!trackDiv) {
            trackDiv = document.createElement("div");
            trackDiv.id = "ticketTracking";
            trackDiv.style = "margin-top: 40px; border-top: 2px dashed #334155; padding-top: 25px;";
            document.getElementById("supportForm").after(trackDiv);
        }
        
        let kanitAlani = "";
        if (icerik.kanit && icerik.kanit !== "Kanıt yüklenmedi") {
            kanitAlani = `<p style="margin-top:10px;"><strong>📸 Kanıt:</strong><br><img src="${icerik.kanit}" style="max-width:100%; margin-top:5px; border-radius:5px;"></p>`;
        }

        trackDiv.innerHTML = `
            <h2 style="color: gold; font-size: 22px; text-align: center; margin-bottom: 15px;">📜 Aktif Destek Talebiniz</h2>
            <div style="border: 1px solid gold; padding: 20px; border-radius: 12px; background: #111827;">
                <p><strong>📌 Kategori:</strong> ${icerik.kategori}</p>
                <p><strong>📝 Konu:</strong> ${icerik.konu}</p>
                <p><strong>💬 Mesajınız:</strong> ${icerik.mesaj}</p>
                ${kanitAlani}
                <hr style="margin:15px 0; border:0; border-top:1px dashed #334155;">
                <p style="color:#ffcc00; font-size:16px;"><strong>👑 Yönetici Yanıtı:</strong></p>
                <p style="color:#10b981; font-weight:bold; margin-top:5px; background:#0f172a; padding:10px; border-radius:5px;">${icerik.yoneticiYaniti}</p>
            </div>
        `;
    } catch(e) { console.log(e); }
}

function convertFileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

async function saveToGitHub(yol, veri) {
    const url = `https://github.com{GITHUB_USER}/${GITHUB_REPO}/contents/${yol}`;
    let sha = "";
    try {
        const check = await fetch(url);
        if(check.ok) { const d = await check.json(); sha = d.sha; }
    } catch(e){}

    await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            message: `Destek: ${veri.oyuncu}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(veri, null, 2)))),
            sha: sha ? sha : undefined
        })
    });
}

window.onload = checkLoginStatus;
</script>

</body>
</html>
