<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Network - Yapay Zeka Asistanı</title>
<style>
*{
    margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;
}
body{
    background:#0f172a; color:white; padding: 40px 20px;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
}
.container {
    width: 100%; max-width: 700px;
}
.back-link {
    display: inline-block; color: #cbd5e1; text-decoration: none; font-size: 14px; margin-bottom: 20px;
}
.back-link:hover { color: gold; }

.chat-box {
    background: #1e293b; border-radius: 20px; border: 1px solid #334155;
    height: 500px; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.chat-header {
    background: #111827; padding: 20px; text-align: center; border-bottom: 1px solid #334155;
}
.chat-header h2 { color: gold; font-size: 20px; }
.chat-header p { color: #94a3b8; font-size: 13px; margin-top: 4px; }

.chat-messages {
    flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
}
.msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; }
.msg.bot { background: #334155; color: white; align-self: flex-start; border-top-left-radius: 5px; }
.msg.user { background: #7c3aed; color: white; align-self: flex-end; border-top-right-radius: 5px; }

.chat-footer {
    padding: 15px; background: #111827; display: flex; gap: 10px; border-top: 1px solid #334155;
}
.chat-footer input {
    flex: 1; padding: 12px; border: none; border-radius: 8px; background: #334155; color: white; outline: none;
}
.chat-footer button {
    padding: 0 20px; background: #7c3aed; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;
}
.chat-footer button:hover { background: #6d28d9; }
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    
    <div class="chat-box">
        <div class="chat-header">
            <h2>👑 Monarch Destek Asistanı</h2>
            <p>Sunucu hakkında merak ettiğin her şeyi sorabilirsin!</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="msg bot">Merhaba kral! Ben Monarch Asistanı. Sunucu IP adresi, yetkili başvuruları, market veya oyun modları hakkında sana nasıl yardımcı olabilirim?</div>
        </div>
        
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

<script>
// Basit Yapay Zeka Cevap Simülasyonu
const botResponses = {
    "ip": "Monarch Network sunucu adresimiz: <b>MonarchNetwork.aternos.me</b> kral! Siteden kopyalayıp oyuna giriş yapabilirsin.",
    "durum": "Sunucumuz şu anda aktiflik durumuna göre güncelleniyor. Ana sayfadaki göstergeden anlık oyuncu sayısına bakabilirsin.",
    "başvuru": "Yetkili kadromuza katılmak istiyorsan, ana sayfadaki 'Yetkili Başvurusu' bölümünden açık formları doldurabilirsin!",
    "market": "VIP paketleri, kasa anahtarları ve özel kozmetikler çok yakında market sayfamızda aktif olacak kral, takipte kal!",
    "smp": "SMP ve Survival modlarımız aktiftir! Yakında efsane etkinlikler ve Box PvP modu da sunucumuza eklenecek.",
    "selam": "Aleykümselam kral, hoş geldin! Sunucuyla ilgili neyi merak ediyorsun?"
};

function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    const chatMessages = document.getElementById("chatMessages");

    // Kullanıcı Mesajı Ekle
    chatMessages.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = "";
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Asistan Cevap Süreci
    setTimeout(() => {
        let reply = "Kral sorduğun soruyu tam anlayamadım ama IP adresi, market, modlar veya başvuru dersen hemen yardımcı olabilirim!";
        const lowerText = text.toLowerCase();

        for (let key in botResponses) {
            if (lowerText.includes(key)) {
                reply = botResponses[key];
                break;
            }
        }

        chatMessages.innerHTML += `<div class="msg bot">${reply}</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }, 600);
}
</script>

</body>
</html>
